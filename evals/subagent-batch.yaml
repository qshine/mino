name: subagent-batch
description: Two delegated tasks run as subagents; their file reads stay in their own sessions, and only their final texts come back to the parent as one result.
prompt: Use subagents to find the port in config/port.txt and the host in config/host.txt, then tell me both.
approve: [spawn_agent]
live: false
workspace:
  files:
    config/port.txt: "port=8080\n"
    config/host.txt: "host=example.test\n"
model:
  - call: {tool: spawn_agent, arguments: {tasks: [{agent: null, task: "Read config/port.txt and report the port."}, {agent: null, task: "Read config/host.txt and report the host."}]}}
  - call: {tool: read_file, arguments: {path: config/port.txt}}
    expect_input_contains: Read config/port.txt and report the port.
  - text: The port is 8080, in config/port.txt.
    expect_input_contains: port=8080
  - call: {tool: read_file, arguments: {path: config/host.txt}}
    expect_input_contains: Read config/host.txt and report the host.
  - text: The host is example.test, in config/host.txt.
    expect_input_contains: host=example.test
  - text: The port is 8080 (config/port.txt) and the host is example.test (config/host.txt).
    expect_input_contains: "Subagent results: 2 tasks, 2 completed"
graders:
  - tool_called: spawn_agent
  - tool_not_called: read_file
  - result_status: {call: 1, status: completed}
  - final_text_contains: "8080"
  - final_text_contains: example.test
  - max_requests: 2
  - max_tool_calls: 1
